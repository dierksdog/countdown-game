<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="title">COUNTDOWN GAME</h1>
    <div class="score-board">
      <p class="highScore">HIGH SCORE: <span class="highScoreNum">0</span></p>
      <p class="scoreFull">Score: <span class="scoreNum">N/A</span></p>
    </div>

    <div class="control">
      <button class="plus" onclick="plus()">+</button>
      <p class="timer">0</p>
      <button class="min" onclick="min()">-</button>
    </div>
    <button class="start" onclick="start()">start</button>
    <img
      class="sniper-gun1"
      src="./assets/Screenshot_2025-11-09_140429-removebg-preview.png"
      alt="sniper"
    />
    <p class="pos-warn">0</p>
    <img
      class="sniper-gun2"
      src="./assets/Screenshot_2025-11-09_140429-removebg-preview.png"
      alt="sniper"
    />
    <p class="neg-warn">0</p>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx"
     crossorigin="anonymous"></script>
    
    <!-- Vertical ad sidebar (left) -->
    <div class="ad-sidebar">
      <!-- Vertical Ad 1 (300x600 Half Page) -->
      <ins class="adsbygoogle"
           style="display:inline-block;width:300px;height:600px"
           data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
           data-ad-slot="xxxxxxxxxx"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
    
    <!-- Horizontal ad banner (bottom) -->
    <div class="ad-banner">
      <!-- Horizontal Ad (728x90 Leaderboard) -->
      <ins class="adsbygoogle"
           style="display:inline-block;width:728px;height:90px"
           data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
           data-ad-slot="xxxxxxxxxx"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
    
    <script src="index.js"></script>
  </body>
</html>
